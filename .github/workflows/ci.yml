name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    name: Bot checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        working-directory: bot
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q bot tools

      - name: Run bot smoke tests
        working-directory: bot
        run: python tests/test_smoke.py

      - name: Test Mini App auth helper
        run: python -m unittest discover -s bot/tests -p "test_*.py"

  admin:
    name: Admin checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Build
        working-directory: admin
        run: npm run build

  miniapp:
    name: Mini App bundle checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundle
        run: python tools/build_miniapp_bundle.py

      - name: Ensure browser bundle does not use localStorage
        run: |
          ! grep -R "localStorage" miniapp/dist/index.html

  security:
    name: Repository secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check for obvious committed secret files
        shell: bash
        run: |
          ! find . -type f \\( -name ".env" -o -name "*.pem" -o -name "*.key" \\) -not -path "./.git/*" | grep .

      - name: Check for seed/private-key markers
        shell: bash
        run: |
          ! grep -RniE "(BEGIN (OPENSSH|RSA|EC|PRIVATE KEY)|xprv|zprv|mnemonic.*=)" \
            --exclude-dir=.git --exclude='*.md' . 
