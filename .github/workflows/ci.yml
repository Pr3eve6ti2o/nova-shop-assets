name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    name: Bot checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        working-directory: bot
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q bot tools

      - name: Run bot smoke tests
        working-directory: bot
        run: python tests/test_smoke.py

      - name: Test Mini App auth helper
        run: python -m unittest discover -s bot/tests -p "test_*.py"

  admin:
    name: Admin checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Build
        working-directory: admin
        run: npm run build

  miniapp:
    name: Mini App bundle checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundle
        run: bash tools/build_miniapp.sh
        env:
          MINIAPP_FAIL_CLOSED: "1"

      - name: Ensure browser bundle does not use localStorage
        run: |
          ! grep -R "localStorage" miniapp/dist/index.html

  security:
    name: Repository secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check for obvious committed secret files
        shell: bash
        run: |
          set -euo pipefail
          secret_files="$(find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) -not -path "./.git/*" -print)"
          if [ -n "$secret_files" ]; then
            echo "ERROR: committed secret files found:" >&2
            printf '%s\n' "$secret_files" >&2
            exit 1
          fi

      - name: Check for seed/private-key markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '(BEGIN (OPENSSH|RSA|EC|PRIVATE KEY)|xprv|zprv|mnemonic.*=)' \
            --exclude-dir=.git --exclude='*.md' --exclude='ci.yml' .; then
            echo "ERROR: private-key/seed markers found" >&2
            exit 1
          fi
